# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/spring-petclinic-angular
  repoUrl: https://github.com/sxarsky/spring-petclinic-angular.git
metadata:
  schemaVersion: v1
  executorVersion: v1.3.40
services:
  - serviceName: spring-petclinic-angular
    language: typescript
    framework: playwright
    # The repo's own suite lives here (playwright.config.ts: testDir './e2e').
    # Generated specs join it, which is the point of this cluster: the agent
    # extends an existing suite rather than seeding an empty one.
    testDirectory: e2e
    api:
      authType: none
      baseUrl: http://localhost:4200
    runtimeDetails:
      serverStartCommand: npm start
      runtime: local
  - serviceName: spring-petclinic-rest
    repository: sxarsky/spring-petclinic-rest
    # ARM pc02: the only delta from pc01-base. The canary declared `java` here and
    # produced zero backend-owned tests, leaving all seven backend-attributed
    # candidates as recommendations. mern-records declared `javascript` for its
    # backend service and got 3-15 tests in the related testDirectory every time.
    # This isolates the declaration from the budget.
    language: javascript
    framework: playwright
    # NOTE: resolved relative to the DELIVERY ROOT (this repo), not the backend
    # repo -- so this is spring-petclinic-angular/tests/skyramp/. Deliberately
    # outside playwright.config.ts's testDir ('./e2e'), per PORTING-GUIDE 5.7:
    # otherwise the primary's suite silently acquires a runtime dependency on
    # the backend service.
    testDirectory: tests/skyramp
    api:
      authType: none
      baseUrl: http://localhost:9966/petclinic/api
    runtimeDetails:
      serverStartCommand: ./mvnw spring-boot:run
      runtime: local
