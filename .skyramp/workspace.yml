# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/spring-petclinic-angular
  repoUrl: https://github.com/sxarsky/spring-petclinic-angular.git
metadata:
  schemaVersion: v1
  executorVersion: v1.3.40
  updatedAt: "2026-08-29T09:12:18.685Z"
services:
  - serviceName: spring-petclinic-angular
    language: typescript
    framework: playwright
    testDirectory: e2e
    api:
      authType: none
      baseUrl: http://localhost:4200
    runtimeDetails:
      serverStartCommand: npm start
      runtime: local
      testSuites:
        - framework: vitest
          testRunCommand: npm run test:ci
          pathGlobs:
            - src/**/*.spec.ts
          canaryStatus: unproven
          canaryDetail: Angular unit suite (ng test, vitest runner) registered by Testbot to baseline external component specs.
        - framework: playwright
          testRunCommand: npx playwright test
          testEnv:
            CI: ""
          pathGlobs:
            - e2e/**/*.e2e-spec.ts
          canaryStatus: unproven
          canaryDetail: >-
            Playwright e2e suite; CI is cleared so playwright.config.ts reuseExistingServer reuses the already-running
            dev server on port 4200 instead of failing on a port clash.
  - serviceName: spring-petclinic-rest
    repository: sxarsky/spring-petclinic-rest
    language: java
    framework: playwright
    testDirectory: tests/skyramp
    api:
      schemaPath: >-
        /home/runner/work/spring-petclinic-angular/spring-petclinic-angular/spring-petclinic-rest/src/main/resources/openapi.yml
      authType: none
      baseUrl: http://localhost:9966/petclinic/api
    runtimeDetails:
      serverStartCommand: ./mvnw spring-boot:run
      runtime: local
