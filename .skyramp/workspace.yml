# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/spring-petclinic-angular
  repoUrl: https://github.com/sxarsky/spring-petclinic-angular
metadata:
  schemaVersion: v1
  executorVersion: v1.3.40
  createdAt: "2026-08-30T08:37:01.639Z"
  updatedAt: "2026-08-30T08:37:01.643Z"
services:
  - serviceName: spring-petclinic-angular
    language: typescript
    framework: playwright
    testDirectory: e2e
    api:
      authType: none
      baseUrl: http://localhost:4200
    runtimeDetails:
      serverStartCommand: npm start
      runtime: local
      testSuites:
        - framework: playwright
          testRunCommand: npx playwright test
          testEnv:
            CI: ""
          pathGlobs:
            - e2e/**/*.e2e-spec.ts
          canaryStatus: unproven
  - serviceName: spring-petclinic-rest
    repository: sxarsky/spring-petclinic-rest
    language: java
    framework: playwright
    testDirectory: tests/skyramp
    api:
      schemaPath: src/main/resources/openapi.yml
      authType: none
      baseUrl: http://localhost:9966/petclinic/api
    runtimeDetails:
      serverStartCommand: ./mvnw spring-boot:run
      runtime: local
