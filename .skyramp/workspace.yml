# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/spring-petclinic-angular
  repoUrl: https://github.com/sxarsky/spring-petclinic-angular.git
metadata:
  schemaVersion: v1
  executorVersion: v1.3.44
  updatedAt: "2026-09-08T19:01:18.322Z"
services:
  - serviceName: spring-petclinic-angular
    language: typescript
    framework: playwright
    testDirectory: e2e
    api:
      authType: none
      baseUrl: http://localhost:4200
    runtimeDetails:
      serverStartCommand: npm start
      runtime: local
      testSuites:
        - framework: vitest
          testRunCommand: npm run test:ci
          pathGlobs:
            - src/**/*.spec.ts
          canaryStatus: unproven
          canaryDetail: >-
            Angular/vitest unit suite (ng test --no-watch); registered by testbot so external unit specs can be
            baselined and verified.
        - framework: playwright
          testRunCommand: npm run e2e
          pathGlobs:
            - e2e/**/*.e2e-spec.ts
          canaryStatus: unproven
          canaryDetail: Playwright e2e suite (playwright.config.ts testDir ./e2e, testMatch **/*.e2e-spec.ts).
  - serviceName: spring-petclinic-rest
    repository: sxarsky/spring-petclinic-rest
    language: java
    framework: playwright
    testDirectory: tests/skyramp
    api:
      authType: none
      baseUrl: http://localhost:9966/petclinic/api
    runtimeDetails:
      serverStartCommand: ./mvnw spring-boot:run
      runtime: local
